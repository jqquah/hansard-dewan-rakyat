name: reach-test
# Manual test: can GitHub's servers download from parlimen.gov.my?
on:
  workflow_dispatch:
jobs:
  reach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: python3 hansard.py doctor || true
      - run: python3 hansard.py convert 2022-12-19 && ls -la data/2022
