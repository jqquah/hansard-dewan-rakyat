name: sweep
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
concurrency:
  group: sweep
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/bot.py sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
