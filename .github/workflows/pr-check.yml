name: pr-check
# pull_request_target runs the MAIN branch code. It only reads the PR's data files
# as data. It never runs code from the pull request.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  issues: write
  pull-requests: write
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - run: python3 tools/bot.py pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
