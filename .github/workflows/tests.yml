name: tests
on:
  push:
    branches: [main]
    paths: ["hansard.py", "tests/**", "tools/**", "requirements.txt", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["hansard.py", "tests/**", "tools/**", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v
