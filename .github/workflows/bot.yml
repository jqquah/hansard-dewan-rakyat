name: claim-bot
on:
  issue_comment:
    types: [created]
permissions:
  issues: write
  pull-requests: write
  contents: write
jobs:
  command:
    # Only comments that start with "/" enter the queue, so a normal comment cannot replace a waiting command.
    if: startsWith(github.event.comment.body, '/') && github.event.comment.user.type != 'Bot'
    concurrency:
      group: bot-${{ github.event.issue.number }}
      cancel-in-progress: false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/bot.py comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
