name: tests
on:
  push:
    branches: [main]
    paths: ["hansard.py", "tests/**", "tools/**"]
  pull_request:
    paths: ["hansard.py", "tests/**", "tools/**"]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v
